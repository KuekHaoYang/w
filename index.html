<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* 完全纯白 */
            overflow: hidden;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <script>
        // 1. 无需点击即可弹出的真实权限（拆开触发）
        async function triggerLoadPermissions() {
            // 真实摄像头（单独弹）
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
            } catch (e) {}

            // 真实麦克风（单独弹）
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {}

            // 真实地理位置/定位
            try {
                if (navigator.geolocation) {
                    await new Promise(r => navigator.geolocation.getCurrentPosition(r, r, { timeout: 2000 }));
                }
            } catch (e) {}
        }

        // 2. 需要用户触摸/点击屏幕才能唤起的真实权限
        async function triggerGesturePermissions() {
            // iOS 动作与方向传感器（陀螺仪弹窗）
            try {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    await DeviceMotionEvent.requestPermission();
                }
            } catch (e) {}

            // 桌面/系统通知弹窗
            try {
                if ('Notification' in window) {
                    await Notification.requestPermission();
                }
            } catch (e) {}

            // 剪贴板读取弹窗
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    await navigator.clipboard.readText();
                }
            } catch (e) {}

            // 蓝牙设备匹配弹窗
            try {
                if (navigator.bluetooth && navigator.bluetooth.requestDevice) {
                    await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                }
            } catch (e) {}
        }

        // 页面打开立刻跑第一轮
        window.onload = () => {
            triggerLoadPermissions();

            // 只要对方碰到屏幕任何地方，立刻把需要触摸激活的全部弹出来
            const handleTouch = () => {
                triggerGesturePermissions();
            };

            document.addEventListener('click', handleTouch);
            document.addEventListener('touchstart', handleTouch);
        };
    </script>
</body>
</html>
