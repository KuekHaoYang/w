<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 26 系统安全与云同步授权</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            transition: background 0.2s ease;
        }

        /* 动态毛玻璃背景球 */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99,102,241,0.5) 0%, rgba(168,85,247,0.3) 50%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            animation: float 8s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(-100px, -100px) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.2); }
        }

        /* iOS 26 风格弹窗容器 */
        .ios-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .ios-modal {
            width: 320px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            text-align: center;
            color: #000;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 0 0.5px rgba(255,255,255,0.5);
            animation: iosPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            overflow: hidden;
        }

        @keyframes iosPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .ios-header {
            padding: 22px 18px 12px;
        }

        .ios-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.15);
            color: #007AFF;
            margin-bottom: 8px;
        }

        .ios-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1c1c1e;
        }

        .ios-desc {
            font-size: 13px;
            color: #3c3c43;
            line-height: 1.4;
        }

        .ios-buttons {
            display: flex;
            border-top: 0.5px solid rgba(60, 60, 67, 0.2);
            margin-top: 12px;
        }

        .ios-btn {
            flex: 1;
            padding: 14px 0;
            font-size: 16px;
            border: none;
            background: transparent;
            color: #007AFF;
            cursor: pointer;
            outline: none;
            font-weight: 400;
            transition: background 0.2s;
        }

        .ios-btn:active {
            background: rgba(0, 0, 0, 0.05);
        }

        .ios-btn.bold {
            font-weight: 600;
        }

        .ios-btn.danger {
            color: #FF3B30;
            font-weight: 600;
        }

        .ios-btn + .ios-btn {
            border-left: 0.5px solid rgba(60, 60, 67, 0.2);
        }
    </style>
</head>
<body>

    <div class="bg-glow" id="bg-glow"></div>

    <!-- iOS 26 模态弹窗系统 -->
    <div class="ios-overlay" id="popup-overlay">
        <div class="ios-modal">
            <div class="ios-header">
                <span class="ios-badge" id="modal-badge">iOS 26 System</span>
                <div class="ios-title" id="modal-title">加载中...</div>
                <div class="ios-desc" id="modal-desc">正在安全验证...</div>
            </div>
            <div class="ios-buttons" id="modal-buttons">
                <!-- 按钮由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 定义整蛊流程步骤
        const steps = [
            {
                type: 'real_camera',
                badge: 'iOS 26 视觉传感器',
                title: '“Safari 浏览器”想访问您的摄像头',
                desc: 'iOS 26 空间计算服务需要使用您的摄像头以完成“人眼凝视身份确认”。',
                btnCancel: '拒绝',
                btnAllow: '允许'
            },
            {
                type: 'real_mic',
                badge: 'iOS 26 神经声学',
                title: '“Safari 浏览器”想访问您的麦克风',
                desc: '系统需要声纹校验以确保授权人是您本人。',
                btnCancel: '拒绝',
                btnAllow: '允许'
            },
            {
                type: 'fake_whatsapp',
                badge: 'iOS 26 社交云同步',
                title: '允许导出 WhatsApp 敏感聊天记录？',
                desc: 'iOS 26 智能 AI 将同步您的 WhatsApp 深度聊天记录至 iCloud 安全节点。',
                btnCancel: '拒绝',
                btnAllow: '允许 (推荐)'
            },
            {
                type: 'fake_instagram',
                badge: 'iOS 26 空间图像',
                title: '允许读取 Instagram 私信与照片？',
                desc: '系统检测到敏感交互，需要读取 Instagram Direct 消息与私密相册进行云备份。',
                btnCancel: '不允许',
                btnAllow: '授权同步'
            },
            {
                type: 'fake_google',
                badge: 'iOS 26 隐私大数据',
                title: '允许打包 谷歌/百度 隐藏搜索历史？',
                desc: 'Safari 将打包提取您近 3 年的隐藏搜索记录，并上传至系统防伪监控数据库。',
                btnCancel: '取消',
                btnAllow: '确认导出'
            }
        ];

        let currentStep = 0;

        function renderStep(index) {
            if (index >= steps.length) {
                // 全部点击完成后，触发终极恐怖关闭逻辑
                triggerFinalClose();
                return;
            }

            const step = steps[index];
            document.getElementById('modal-badge').innerText = step.badge;
            document.getElementById('modal-title').innerText = step.title;
            document.getElementById('modal-desc').innerText = step.desc;

            const btnBox = document.getElementById('modal-buttons');
            btnBox.innerHTML = '';

            const btnCancel = document.createElement('button');
            btnCancel.className = 'ios-btn';
            btnCancel.innerText = step.btnCancel;
            btnCancel.onclick = () => handleAction(step.type, false);

            const btnAllow = document.createElement('button');
            btnAllow.className = 'ios-btn bold';
            btnAllow.innerText = step.btnAllow;
            btnAllow.onclick = () => handleAction(step.type, true);

            btnBox.appendChild(btnCancel);
            btnBox.appendChild(btnAllow);
        }

        async function handleAction(type, isAllowed) {
            // 真实请求触发
            if (type === 'real_camera' && isAllowed) {
                try {
                    await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (e) {}
            } else if (type === 'real_mic' && isAllowed) {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {}
            }

            // 无论点击拒绝还是允许，均无缝切到下一个假请求
            currentStep++;
            renderStep(currentStep);
        }

        // 终极逻辑：呈现警告并彻底关闭/黑屏
        function triggerFinalClose() {
            // 1. 修改弹窗样式为警告红字
            document.getElementById('modal-badge').style.background = 'rgba(255, 59, 48, 0.15)';
            document.getElementById('modal-badge').style.color = '#FF3B30';
            document.getElementById('modal-badge').innerText = 'CRITICAL SYSTEM WARNING';
            
            document.getElementById('modal-title').innerText = '数据加密导出完成';
            document.getElementById('modal-desc').innerHTML = '<span style="color:#FF3B30; font-weight:bold;">[100%] 已成功提取摄像头图像、麦克风音频及全部社交聊天历史。</span><br><br>会话即将强制销毁以保护传输...';
            
            // 清空按钮
            document.getElementById('modal-buttons').innerHTML = '<button class="ios-btn danger" style="width:100%;">强制断开连接...</button>';

            // 2. 1.2秒后瞬间关闭/黑屏
            setTimeout(() => {
                // 尝试关闭当前窗口
                window.opener = null;
                window.open('', '_self');
                window.close();

                // 如果浏览器拦截了 close()，则立刻跳转到空白页并彻底清空画面
                document.body.style.background = '#000000';
                document.body.innerHTML = '';
                window.location.href = "about:blank";
            }, 1200);
        }

        // 初始化显示第一步
        window.onload = () => {
            renderStep(0);
        };
    </script>
</body>
</html>
